name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated pages are up to date
        run: node scripts/build.mjs --check
      - name: Unit tests
        run: node --test scripts/tests/*.test.mjs

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=scripts/lighthouserc.json
